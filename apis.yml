aid: library-of-congress
name: Library of Congress
description: >-
  The Library of Congress is the largest library in the world, with millions of books, films and video, audio
  recordings, photographs, newspapers, maps and manuscripts in its collections. The Library is the main research arm of
  the U.S. Congress and the home of the U.S. Copyright Office. The Library publishes a suite of public APIs that expose
  its catalog, digital collections, historic newspapers, and legislative information.
